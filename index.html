<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBFA">
<meta name="description" content="Hojas de vida de los equipos de gases medicinales: compresores, bombas de vacío, SAM y generadores de oxígeno. Funciona sin señal.">
<title>Hojas de vida · Gases medicinales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=20261119">
<link rel="apple-touch-icon" href="icon-192.png?v=20261119">
<style>
/* ================= PixelUI (copia fiel de Mornye) · Clínica Reina Catalina ================= */
:root{
  --prin:#84303F;--prin-osc:#6B2433;--sobre-prin:#fff;
  --cont:#FFCCD4;--sobre-cont:#33030F;
  --fondo:#FFFBFA;--fila:#F5EEEF;--alta:#EEE6E7;--barra:#F3ECED;--apagado:#E7DCDD;
  --tinta:#160D0E;--suave:#45343A;--borde:#D3B8BC;--gris:#857374;
  --ok:#D3F0DC;--ok-t:#1B5E33;--verde:#E3F4E8;
  --ambar:#FFF3DC;--ambar-t:#7A4A00;--rojo:#FCE4E1;--rojo-late:#F6C6C0;--rojo-t:#B3261E;
  --m3:cubic-bezier(.2,0,0,1);--entra:cubic-bezier(.05,.7,.1,1);--rebote:cubic-bezier(.34,1.56,.64,1);--sale:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:560 16px/1.4 'Google Sans Flex','Roboto Flex',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{min-height:100dvh;overscroll-behavior-y:contain}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--prin);outline-offset:2px}
.oculto{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.s{width:18px;height:18px}.ic.l{width:32px;height:32px}
button,.toca{transition:transform 150ms var(--sale),background 350ms var(--m3),color 350ms var(--m3),border-color 350ms var(--m3)}
button:active:not(:disabled),.toca:active{transform:scale(.97)}

/* ---------- Estructura ---------- */
#app{min-height:100dvh}
.pantalla-c{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.pantalla-c .logo-g{width:88px;height:88px;border-radius:50%;align-self:center}
.pantalla-c h1{font-size:30px;font-weight:860;text-align:center;line-height:1.15}
.pantalla-c p.sub{text-align:center;color:var(--suave)}
.marco{display:block}
.cuerpo{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
/* Con botón fijo abajo (y barra de navegación) dejar espacio para que no tape lo último */
.cuerpo:has(>.accion-fija:not(.en-lista)){padding-bottom:calc(184px + env(safe-area-inset-bottom))}
.sin-nav .cuerpo:has(>.accion-fija:not(.en-lista)){padding-bottom:calc(104px + env(safe-area-inset-bottom))}

/* ---------- Encabezado (como Mornye, sin volver en la pantalla principal) ---------- */
.cab{padding:calc(12px + env(safe-area-inset-top)) 4px 8px}
.cab-fila{display:flex;align-items:center;gap:4px;min-height:48px}
.cab-fila .logo{width:36px;height:36px;border-radius:50%;object-fit:cover}
.cab-fila .esp{flex:1}
.btn-ic{width:48px;height:48px;border-radius:24px;border:0;background:none;color:var(--tinta);display:grid;place-items:center;text-decoration:none;flex:none}
.btn-ic:active{background:var(--alta)}
.cab h1{font-size:34px;line-height:40px;font-weight:860;letter-spacing:-.3px;margin:44px 4px 4px}
.cab .ctx{font-size:15px;color:var(--suave);margin:0 4px;font-variant-numeric:tabular-nums}
.cab.interna h1{margin-top:20px;font-size:28px;line-height:34px}
.compacta{position:fixed;left:0;right:0;top:0;z-index:6;background:var(--alta);display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;transform:translateY(-110%);transition:transform 350ms var(--m3)}
.compacta.on{transform:none}
.compacta b{font-size:18px;font-weight:760;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Franja de sincronización ---------- */
.franja{display:flex;align-items:center;gap:8px;margin:4px 0 8px;padding:8px 8px 8px 14px;border-radius:16px;font-size:14px;line-height:1.35}
.franja span{flex:1}
.franja.ok{background:var(--ok);color:var(--ok-t)}
.franja.espera{background:var(--ambar);color:var(--ambar-t)}
.franja.sube{background:var(--alta);color:var(--tinta)}
.franja.error{background:var(--rojo);color:var(--rojo-t)}
.franja button{border:0;background:rgba(0,0,0,.07);color:inherit;font-weight:760;font-size:14px;border-radius:12px;min-height:40px;padding:0 12px}

/* ---------- Búsqueda y filtros ---------- */
.buscar{display:flex;align-items:center;gap:10px;background:var(--alta);border-radius:28px;min-height:56px;padding:0 6px 0 16px;color:var(--suave);margin-top:12px}
.buscar input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px;color:var(--tinta);padding:14px 0}
.buscar input::placeholder{color:var(--suave)}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px 2px}
.filtros::-webkit-scrollbar{display:none}
.ficha{flex:none;min-height:36px;border-radius:10px;border:1px solid var(--borde);background:transparent;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:660;white-space:nowrap;color:var(--tinta)}
.ficha .n{font-variant-numeric:tabular-nums;color:var(--suave);font-weight:560}
.ficha[aria-pressed="true"]{background:var(--cont);border-color:var(--cont);color:var(--sobre-cont)}
.ficha[aria-pressed="true"] .n{color:var(--sobre-cont)}
.fichas{display:flex;flex-wrap:wrap;gap:8px}
.fichas .ficha{min-height:44px;font-size:15px;padding:0 14px}

/* ---------- Secciones y grupos de filas ---------- */
.secc{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 8px 10px;font-size:20px;line-height:26px;font-weight:660}
.secc small{font-size:14px;font-weight:560;color:var(--suave)}
.grupo{display:flex;flex-direction:column;gap:3px}
.fila{display:flex;align-items:center;gap:12px;background:var(--fila);border-radius:6px;padding:10px 12px;min-height:72px;border:0;width:100%;text-align:left;color:var(--tinta)}
.grupo>.fila:first-child{border-top-left-radius:28px;border-top-right-radius:28px}
.grupo>.fila:last-child{border-bottom-left-radius:28px;border-bottom-right-radius:28px}
.mini{width:48px;height:48px;border-radius:14px;background:var(--alta);display:grid;place-items:center;flex:none;color:var(--prin);overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.fila .txt{flex:1;min-width:0}
.fila .t{font-size:17px;font-weight:660;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.fila .st{font-size:15px;color:var(--suave);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dato{background:var(--alta);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:660;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.fila .flecha{color:var(--gris)}
.fila.ambar{background:var(--ambar)}.fila.ambar .st{color:var(--ambar-t)}
.fila.rojo{background:var(--rojo);animation:late 2.4s ease-in-out infinite}.fila.rojo .st{color:var(--rojo-t)}
.fila.ambar .dato,.fila.rojo .dato,.fila.ambar .mini,.fila.rojo .mini{background:#fff}
.fila.verde{background:var(--verde)}
@keyframes late{0%,100%{background:var(--rojo)}50%{background:var(--rojo-late)}}
.pend{display:inline-flex;align-items:center;gap:3px;color:var(--ambar-t);font-weight:660}
.par{display:flex;justify-content:space-between;gap:12px;min-height:56px;align-items:center}
.par .k{color:var(--suave);font-size:15px;flex:none;max-width:48%}
.par .v{text-align:right;font-weight:660;font-size:16px;overflow-wrap:anywhere}
.vacio{text-align:center;padding:36px 16px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:8px}
.vacio b{color:var(--tinta);font-size:18px}

/* ---------- Tarjeta destacada ---------- */
.destacada{background:var(--cont);color:var(--sobre-cont);border-radius:32px;padding:16px;display:flex;align-items:center;gap:14px;margin-top:16px}
.destacada .txt{flex:1;min-width:0}
.destacada .k{font-size:14px}
.destacada .g{font-size:22px;font-weight:760;line-height:1.2;margin:2px 0}
.redondo{width:56px;height:56px;border-radius:28px;border:0;background:var(--prin);color:#fff;display:grid;place-items:center;flex:none}
.destacada.ambar{background:var(--ambar);color:var(--ambar-t)}
.destacada.rojo{background:var(--rojo);color:var(--rojo-t);animation:late 2.4s ease-in-out infinite}

/* ---------- Detalle de equipo ---------- */
.foto-eq{display:flex;gap:14px;align-items:center;margin-top:8px}
.foto-eq .grande{width:96px;height:96px;border-radius:20px;background:var(--alta);display:grid;place-items:center;color:var(--prin);flex:none;overflow:hidden;border:0;padding:0}
.foto-eq .grande img{width:100%;height:100%;object-fit:cover}
.chip-est{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:760;margin-top:6px}
.chip-est.Funcionando{background:var(--ok);color:var(--ok-t)}
.chip-est.obs{background:var(--ambar);color:var(--ambar-t)}
.chip-est.fuera{background:var(--rojo);color:var(--rojo-t)}
.chip-est.baja{background:var(--alta);color:var(--suave)}

/* ---------- Formularios ---------- */
.campo{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.campo:first-child{margin-top:0}
.etq{font-size:15px;font-weight:660;color:var(--suave);display:flex;justify-content:space-between;gap:8px}
.etq em{font-style:normal;font-weight:560;color:var(--gris);font-size:13px}
.entrada{width:100%;min-height:56px;border:1px solid transparent;border-radius:16px;background:var(--alta);padding:14px 16px;font-size:17px;outline:0;color:var(--tinta)}
.entrada:focus{border-color:var(--prin);background:var(--fondo)}
.entrada::placeholder{color:var(--gris)}
textarea.entrada{min-height:96px;resize:vertical;line-height:1.4}
.entrada.mal,.parpadea{animation:parpadeo .9s var(--m3) 2}
@keyframes parpadeo{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 3px var(--rojo-t)}}
.dos-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tarjeta{background:var(--fila);border-radius:28px;padding:16px}
.listo{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:13px;background:var(--ok);color:var(--ok-t);font-size:13px;font-weight:760;animation:aparece 350ms var(--rebote)}
.listo .ic{width:16px;height:16px}
@keyframes aparece{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.ayuda{font-size:14px;color:var(--suave)}
.foto-btn{width:100%;min-height:120px;border:1.5px dashed var(--borde);border-radius:24px;background:transparent;color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:660}
.foto-prev{position:relative;width:100%;border-radius:24px;overflow:hidden;background:var(--alta)}
.foto-prev img{display:block;width:100%;max-height:280px;object-fit:cover}
.foto-prev .acc{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.foto-prev .acc button{min-height:40px;border:0;border-radius:20px;background:rgba(22,13,14,.75);color:#fff;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:660}
.fotos-mt{display:flex;gap:8px;flex-wrap:wrap}
.fotos-mt .f{width:72px;height:72px;border-radius:16px;overflow:hidden;position:relative;background:var(--alta);border:0;padding:0;display:grid;place-items:center;color:var(--prin)}
.fotos-mt .f img{width:100%;height:100%;object-fit:cover}
.fotos-mt .f .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:12px;background:rgba(22,13,14,.75);color:#fff;display:grid;place-items:center}
.firma{position:relative;border:1.5px dashed var(--gris);border-radius:20px;background:#fff;height:160px;touch-action:none;overflow:hidden}
.firma canvas{width:100%;height:100%;display:block}
.firma .marca{position:absolute;inset:auto 16px 34px 16px;border-bottom:1px solid var(--borde);pointer-events:none}
.firma .guia{position:absolute;left:16px;bottom:10px;font-size:13px;color:var(--gris);pointer-events:none}
.firma .borrar{position:absolute;top:8px;right:8px;min-height:36px;border:0;border-radius:18px;background:var(--alta);padding:0 12px;font-size:14px;font-weight:660}
.archivo{display:flex;align-items:center;gap:10px;background:var(--alta);border-radius:16px;padding:10px 12px}
.archivo .txt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}

/* ---------- Botones ---------- */
.btn{min-height:56px;border-radius:28px;border:0;background:var(--prin);color:#fff;font-weight:760;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;width:100%;text-decoration:none}
.btn:active{background:var(--prin-osc)}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--gris)}
.btn.sec:active{background:var(--alta)}
.btn.ton{background:var(--cont);color:var(--sobre-cont)}
.btn.mini{min-height:40px;width:auto;font-size:14px;padding:0 16px;border-radius:20px}
.btn[disabled]{opacity:.55}
.accion-fija{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));z-index:5;pointer-events:none;display:flex;justify-content:center;padding:0 16px}
.accion-fija .btn{max-width:728px;pointer-events:auto;box-shadow:0 4px 14px rgba(51,3,15,.18)}
.sin-nav .accion-fija{bottom:calc(16px + env(safe-area-inset-bottom))}
.pastilla{min-height:40px;border-radius:20px;border:0;background:var(--prin);color:#fff;font-weight:760;font-size:14px;padding:0 16px;flex:none}

/* ---------- Navegación ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--barra);padding-bottom:env(safe-area-inset-bottom)}
.nav .dentro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:760px;margin:0 auto}
.nav button{border:0;background:none;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:660;color:var(--suave);position:relative}
.nav .pil{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background 350ms var(--m3)}
.nav button[aria-current="page"]{color:var(--tinta);font-weight:860}
.nav button[aria-current="page"] .pil{background:var(--cont);color:var(--sobre-cont)}
.nav .punto{position:absolute;top:10px;left:calc(50% + 12px);min-width:18px;height:18px;border-radius:9px;background:var(--ambar-t);color:#fff;font-size:11px;font-weight:760;line-height:18px;padding:0 5px}
.sin-nav .nav{display:none}

/* ---------- Avisos ---------- */
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:20;display:flex;justify-content:center;pointer-events:none}
.toast>div{background:#382E2F;color:#FCEBEC;border-radius:16px;padding:12px 16px;font-size:15px;display:flex;gap:10px;align-items:center;max-width:560px;width:100%;animation:sube 450ms var(--entra)}
.toast>div.con{pointer-events:auto;padding:6px 6px 6px 16px}
.toast span{flex:1;display:flex;align-items:center;gap:10px}
.toast button{border:0;background:none;color:#FFB3BB;font-weight:860;min-height:44px;padding:0 16px;border-radius:22px;flex:none}
@keyframes sube{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.nuevaver{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:560px;margin:auto;z-index:30;display:flex;align-items:center;gap:8px;background:#382E2F;color:#FCEBEC;border-radius:16px;padding:8px 8px 8px 18px;font-size:15px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity 200ms var(--m3),transform 450ms var(--entra)}
.nuevaver.on{opacity:1;transform:none;pointer-events:auto}.nuevaver span{flex:1}
.nuevaver button{border:0;background:none;color:#FFB3BB;font-weight:860;min-height:44px;padding:0 14px;border-radius:22px}
.hoja{position:fixed;inset:0;z-index:25;background:rgba(22,13,14,.4);display:flex;align-items:flex-end;justify-content:center;animation:fundido 200ms var(--sale)}
.hoja>div{background:var(--fondo);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:subeHoja 300ms var(--entra);max-height:90dvh;overflow:auto}
.hoja h2{font-size:22px;font-weight:760;margin:4px 4px 12px}
@keyframes fundido{from{opacity:0}to{opacity:1}}
@keyframes subeHoja{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tres .btn{flex-direction:column;gap:4px;font-size:14px;min-height:76px;border-radius:24px;padding:8px}

/* ---------- Entrada escalonada ---------- */
.entra>*{animation:subeL 450ms var(--entra) both}
.entra>*:nth-child(2){animation-delay:50ms}.entra>*:nth-child(3){animation-delay:100ms}.entra>*:nth-child(4){animation-delay:150ms}.entra>*:nth-child(5){animation-delay:200ms}.entra>*:nth-child(n+6){animation-delay:250ms}
@keyframes subeL{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:background 0ms,color 0ms!important}button:active:not(:disabled),.toca:active{transform:none}.fila.rojo,.destacada.rojo{background:var(--rojo-late)}}

/* ---------- Tablet ---------- */
@media (min-width:700px){.cuerpo{padding-left:24px;padding-right:24px}}

/* ---------- PC: riel lateral, tabla y detalle al lado ---------- */
.solo-pc{display:none}
@media (min-width:1024px){
  .marco{display:grid;grid-template-columns:96px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100dvh;padding:16px 0;grid-column:1;grid-row:1}
  .nav .dentro{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:none}
  .nav .logo-r{width:40px;height:40px;border-radius:50%;margin-bottom:12px}
  .nav button{min-height:64px;width:80px}
  .sin-nav .nav{display:block}
  .principal{grid-column:2;min-width:0}
  .cuerpo{max-width:1320px;padding:0 32px 48px}
  .cuerpo:has(>.accion-fija:not(.en-lista)),.sin-nav .cuerpo:has(>.accion-fija:not(.en-lista)){padding-bottom:48px}
  .cab h1{margin-top:28px}
  .accion-fija{position:sticky;bottom:16px;padding:0;margin-top:20px}
  .sin-nav .accion-fija{bottom:16px}
  .toast{left:auto;right:32px;bottom:28px;justify-content:flex-end}
  .toast>div{width:auto}
  .solo-pc{display:block}
  .solo-cel{display:none!important}
  .pc-dos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,1fr);gap:28px;align-items:start}
  .pc-dos>.det{position:sticky;top:16px;background:var(--fila);border-radius:28px;padding:20px;max-height:calc(100dvh - 32px);overflow:auto}
  .form-pc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 28px;align-items:start}
  .form-pc>.ancho{grid-column:1/-1}
  .tabla{width:100%;border-collapse:separate;border-spacing:0 3px;font-size:15px}
  .tabla th{text-align:left;font-size:13px;color:var(--suave);font-weight:660;padding:4px 12px}
  .tabla td{background:var(--fila);padding:10px 12px;vertical-align:middle}
  .tabla tr td:first-child{border-radius:14px 0 0 14px}.tabla tr td:last-child{border-radius:0 14px 14px 0}
  .tabla tr{cursor:pointer}
  .tabla tr:hover td{background:var(--alta)}
